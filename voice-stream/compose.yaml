name: farast-voice

services:
  sherpa-asr:
    build:
      context: ./sherpa-sidecar
    restart: unless-stopped
    environment:
      SHERPA_HOST: 0.0.0.0
      SHERPA_PORT: 6006
      SHERPA_MODEL_DIR: /models
      SHERPA_NUM_THREADS: ${SHERPA_NUM_THREADS:-2}
      SHERPA_MAX_CONCURRENT_SESSIONS: ${SHERPA_MAX_CONCURRENT_SESSIONS:-2}
    volumes:
      - farast-sherpa-models:/models
    expose:
      - "6006"
    healthcheck:
      test: ["CMD", "python", "-c", "from websockets.sync.client import connect; ws=connect('ws://127.0.0.1:6006',open_timeout=2); ws.close()"]
      interval: 15s
      timeout: 4s
      retries: 30
      start_period: 90s

  piper-tts:
    build:
      context: ./piper-sidecar
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      PIPER_MODEL_DIR: /models
      PIPER_HOST: 0.0.0.0
      PIPER_PORT: 7007
    volumes:
      - farast-piper-models:/models
    ports:
      - "${VOICE_TTS_BIND_ADDRESS:-127.0.0.1}:7007:7007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7007/health', timeout=3).read()"]
      interval: 15s
      timeout: 4s
      retries: 20
      start_period: 60s

  gateway:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.runtime
    environment:
      PORT: "6002"
      VOICE_STREAM_HOST: 0.0.0.0
      VOICE_STREAM_PORT: "6002"
      VOICE_STREAM_APP_URL: ${VOICE_STREAM_APP_URL:?Run start.cmd or set VOICE_STREAM_APP_URL}
      VOICE_STREAM_ORIGINS: ${VOICE_STREAM_ORIGINS:?Run start.cmd or set VOICE_STREAM_ORIGINS}
      SHERPA_ONNX_WS_URL: ws://sherpa-asr:6006
      SHERPA_ONNX_ALLOWED_HOSTS: sherpa-asr
      VOICE_STREAM_RESTART_MS: ${VOICE_STREAM_RESTART_MS:-270000}
    ports:
      - "${VOICE_STREAM_BIND_ADDRESS:-127.0.0.1}:6002:6002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sherpa-asr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 20s

  # Local-only LLM profile. Hosted deployments can point Laravel at the private
  # Runflare gateway instead and omit --profile local-ai.
  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - farast-ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:0.40.13
    profiles: ["local-ai"]
    restart: "no"
    volumes:
      - farast-ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3:1.7b"]
    depends_on:
      ollama:
        condition: service_healthy

  local-ai-gateway:
    build:
      context: ./local-ai-gateway
    profiles: ["local-ai"]
    restart: unless-stopped
    env_file:
      - .env.ai-runtime
    environment:
      HOST: 0.0.0.0
      PORT: "7008"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    ports:
      - "${AI_GATEWAY_BIND_ADDRESS:-127.0.0.1}:7008:7008"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7008/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  farast-sherpa-models:
  farast-piper-models:
  farast-ollama-models:
