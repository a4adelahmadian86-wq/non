services:
  - type: web
    name: farast-product-supervisor
    runtime: python
    rootDir: services/product-supervisor
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --limit-concurrency 2 --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: SUPERVISOR_API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_AUDIO_MODEL
        value: whisper-large-v3-turbo
