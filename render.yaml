services:
  - type: web
    name: farast-product-supervisor
    runtime: python
    rootDir: services/product-supervisor
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --limit-concurrency 2 --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: SUPERVISOR_API_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_AUDIO_MODEL
        value: whisper-large-v3-turbo

  - type: web
    name: farast-document-audio
    runtime: python
    rootDir: services/document-audio
    plan: free
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 2 --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: DOCUMENT_AUDIO_API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: PIPER_VOICE_ID
        value: farast-document-fa-male-37-v1
