<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091735"><title>فراست | بدون اتصال</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#203d78,#091735 55%);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif}.card{width:min(560px,calc(100% - 32px));padding:42px 34px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.25);text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:19px;background:linear-gradient(145deg,#1769ff,#6842d4);display:grid;place-items:center;font-size:28px;box-shadow:0 16px 35px rgba(23,105,255,.3)}h1{font-size:24px;margin:0 0 8px}p{color:#b9c8e2;font-size:12px;line-height:2;margin:0 0 22px}.btn{border:0;border-radius:12px;background:#fff;color:#172a4d;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}</style></head><body><main class="card"><div class="mark">⌁</div><h1>اتصال اینترنت در دسترس نیست</h1><p>فراست آماده است، اما این بخش هنوز در حافظه مرورگر ذخیره نشده است. اتصال را برقرار کنید و دوباره تلاش کنید.</p><button class="btn" onclick="location.reload()">تلاش دوباره</button></main></body></html>
