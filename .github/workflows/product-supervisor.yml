name: Product Supervisor Service

on:
  pull_request:
    paths:
      - "services/product-supervisor/**"
      - "app/Http/Controllers/AdminProductSupervisorController.php"
      - "app/Http/Controllers/AdminStoreController.php"
      - "app/Services/ProductSupervisorClient.php"
      - "config/services.php"
      - "routes/store_routes.php"
      - "resources/views/admin/store/form.blade.php"
      - "render.yaml"
      - ".github/workflows/product-supervisor.yml"
  push:
    branches: [main]
    paths:
      - "services/product-supervisor/**"
      - "app/Http/Controllers/AdminProductSupervisorController.php"
      - "app/Http/Controllers/AdminStoreController.php"
      - "app/Services/ProductSupervisorClient.php"
      - "config/services.php"
      - "routes/store_routes.php"
      - "resources/views/admin/store/form.blade.php"
      - "render.yaml"
      - ".github/workflows/product-supervisor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product-supervisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product-supervisor/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run service tests
        run: pytest -q
      - name: Set up PHP for Laravel integration checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Check Laravel integration syntax
        run: |
          php -l ../../app/Http/Controllers/AdminProductSupervisorController.php
          php -l ../../app/Http/Controllers/AdminStoreController.php
          php -l ../../app/Services/ProductSupervisorClient.php
          php -l ../../app/Services/ProductSupervisorSnapshotBuilder.php
          php -l ../../routes/store_routes.php
          php -l ../../config/services.php
