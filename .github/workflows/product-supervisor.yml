name: Product Supervisor Service

on:
  pull_request:
    paths:
      - "services/product-supervisor/**"
      - "scripts/performance/**"
      - "app/Http/Controllers/AdminProductSupervisorController.php"
      - "app/Http/Controllers/AdminStoreController.php"
      - "app/Http/Controllers/AdminCourseController.php"
      - "app/Services/ProductSupervisorClient.php"
      - "config/services.php"
      - "routes/store_routes.php"
      - "resources/views/admin/store/form.blade.php"
      - "resources/views/admin/store/course.blade.php"
      - "render.yaml"
      - "scripts/verify-test-environment.php"
      - ".github/workflows/product-supervisor.yml"
  push:
    branches: [main]
    paths:
      - "services/product-supervisor/**"
      - "scripts/performance/**"
      - "app/Http/Controllers/AdminProductSupervisorController.php"
      - "app/Http/Controllers/AdminStoreController.php"
      - "app/Services/ProductSupervisorClient.php"
      - "config/services.php"
      - "routes/store_routes.php"
      - "resources/views/admin/store/form.blade.php"
      - "render.yaml"
      - "scripts/verify-test-environment.php"
      - ".github/workflows/product-supervisor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/product-supervisor
    steps:
      - uses: actions/checkout@v4
      - name: Check k6 scenario JavaScript syntax
        run: node --input-type=module --check < ../../scripts/performance/critical-routes.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product-supervisor/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run service tests
        run: pytest -q
      - name: Build stateless Product Supervisor container
        run: docker build -t farast-product-supervisor .
      - name: Smoke-test container at Back4App free resource limits
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name farast-product-supervisor-ci \
            --memory=256m --memory-swap=256m --cpus=0.25 \
            -e SUPERVISOR_API_TOKEN=ci-only-token \
            -p 8099:8000 farast-product-supervisor
          cleanup() {
            docker logs farast-product-supervisor-ci || true
            docker rm -f farast-product-supervisor-ci >/dev/null 2>&1 || true
            rm -f /tmp/farast-supervisor-smoke.txt /tmp/farast-supervisor-response.json
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8099/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          python - <<'PY'
          from pathlib import Path
          line = "FARAST memory-limited upload smoke test. "
          target = Path("/tmp/farast-supervisor-smoke.txt")
          target.write_text(line * ((24 * 1024 * 1024) // len(line)), encoding="utf-8")
          PY
          curl --silent --show-error --fail \
            -H "Authorization: Bearer ci-only-token" \
            -F "file=@/tmp/farast-supervisor-smoke.txt;type=text/plain" \
            -F "product_id=ci-smoke" \
            -F "product_title=FARAST CI smoke test" \
            -F "product_type=digital_file" \
            -F "primary_scan_status=clean" \
            http://127.0.0.1:8099/v1/reviews/files \
            -o /tmp/farast-supervisor-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/farast-supervisor-response.json").read_text(encoding="utf-8"))
          assert isinstance(result, dict), "Product Supervisor did not return a JSON object"
          assert result.get("inspection", {}).get("detected_type") == "text", "24 MiB text upload was not inspected"
          PY
      - name: Set up PHP for Laravel integration checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Check Laravel integration syntax
        run: |
          php -l ../../app/Http/Controllers/AdminProductSupervisorController.php
          php -l ../../app/Http/Controllers/AdminStoreController.php
          php -l ../../app/Http/Controllers/AdminCourseController.php
          php -l ../../app/Services/ProductSupervisorClient.php
          php -l ../../app/Services/ProductSupervisorSnapshotBuilder.php
          php -l ../../routes/store_routes.php
          php -l ../../config/services.php
