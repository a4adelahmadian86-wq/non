name: FARAST CI
on:
  push:
    branches: [main, farast-restoration-2026-09]
  pull_request:
    branches: [main]
jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: printf '%s\n' 'APP_NAME=FARAST' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' 'APP_URL=http://localhost' 'DB_CONNECTION=sqlite' 'DB_DATABASE=database/database.sqlite' 'CACHE_STORE=array' 'SESSION_DRIVER=array' 'QUEUE_CONNECTION=sync' > .env
      - run: php -l app/Services/EditorDocumentService.php && php -l app/Http/Controllers/EditorController.php && php -l app/Http/Controllers/EditorDocumentStateController.php && php -l app/Http/Controllers/EditorSaveController.php && php -l app/Http/Controllers/ExportController.php && php -l app/Models/FarastDocument.php && php -l app/Models/FarastDocumentVersion.php
      - run: node --check public/js/editor-core.js
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/farast-server.log 2>&1 &
      - run: npm init -y
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          FARAST_E2E_URL: http://127.0.0.1:8000
