name: FARAST Phase 4 Agent
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: printf '%s\n' 'APP_NAME=FARAST' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' 'APP_URL=http://localhost' 'APP_KEY=' 'APP_DEBUG=true' 'DB_CONNECTION=sqlite' 'DB_DATABASE=database/database.sqlite' 'CACHE_STORE=array' 'SESSION_DRIVER=file' 'QUEUE_CONNECTION=sync' > .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
      - run: php artisan test --filter='FarastEditorAgentTest'
      - run: ADMIN_MOBILE=09151234567 ADMIN_INITIAL_PASSWORD=${GITHUB_RUN_ID}-farast-e2e php artisan db:seed --force
      - run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/farast-agent.log 2>&1 &
      - run: npm init -y
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/phase4-agent.spec.js --workers=1
      - if: always()
        run: cat /tmp/farast-agent.log