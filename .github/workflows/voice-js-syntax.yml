name: voice-js-syntax

on:
  push:
    branches: [main]
    paths:
      - 'public/js/editor-voice-hub.js'
      - 'public/js/farast-whisper-worker.js'
      - 'public/js/farast-assistant.js'
      - 'public/js/editor-docs-chrome.js'
      - 'app/Http/Controllers/GlobalAssistantController.php'
      - 'routes/web_core_part1.php'
      - '.github/workflows/voice-js-syntax.yml'
  pull_request:
    paths:
      - 'public/js/editor-voice-hub.js'
      - 'public/js/farast-whisper-worker.js'
      - 'public/js/farast-assistant.js'
      - 'public/js/editor-docs-chrome.js'
      - 'app/Http/Controllers/GlobalAssistantController.php'
      - 'routes/web_core_part1.php'
      - '.github/workflows/voice-js-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check voice-related JavaScript syntax
        run: |
          node --check public/js/editor-voice-hub.js
          node --check public/js/farast-whisper-worker.js
          node --check public/js/farast-assistant.js
          node --check public/js/editor-docs-chrome.js
      - name: Check voice streaming PHP syntax
        run: |
          php -l app/Http/Controllers/GlobalAssistantController.php
          php -l routes/web_core_part1.php