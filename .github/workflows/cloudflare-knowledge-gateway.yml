name: FARAST Cloudflare Knowledge Gateway

on:
  pull_request:
    paths:
      - "services/cloudflare-knowledge-gateway/**"
      - ".github/workflows/cloudflare-knowledge-gateway.yml"
  push:
    branches: [main]
    paths:
      - "services/cloudflare-knowledge-gateway/**"
      - ".github/workflows/cloudflare-knowledge-gateway.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the knowledge gateway to Cloudflare"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloudflare-knowledge-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run gateway tests
        run: npm test
      - name: Validate Worker bundle and bindings
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloudflare-knowledge-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
