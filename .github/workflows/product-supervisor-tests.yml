name: Product Supervisor Tests

on:
  pull_request:
    paths:
      - "services/product-supervisor/**"
      - ".github/workflows/product-supervisor-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/product-supervisor/**"
      - ".github/workflows/product-supervisor-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product-supervisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product-supervisor/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
