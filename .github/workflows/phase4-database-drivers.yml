name: FARAST Phase 4 Database Drivers

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/Models/Order.php'
      - 'app/Models/Payment.php'
      - 'app/Models/WalletTransaction.php'
      - 'app/Http/Controllers/PaymentController.php'
      - 'app/Http/Controllers/WalletController.php'
      - 'app/Http/Controllers/StoreCartController.php'
      - 'app/Http/Controllers/Concerns/PaysWithZarinpal.php'
      - 'database/migrations/**'
      - 'tests/Feature/*Migration*Test.php'
      - 'tests/Feature/*Ledger*Test.php'
      - 'tests/Feature/FinancialIdempotencyAndRetentionTest.php'
      - '.github/workflows/phase4-database-drivers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: printf '%s\n' 'APP_NAME=FARAST' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' 'APP_URL=http://localhost' 'DB_CONNECTION=sqlite' 'DB_DATABASE=database/database.sqlite' 'CACHE_STORE=array' 'SESSION_DRIVER=file' 'QUEUE_CONNECTION=sync' > .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate:fresh --force
      - run: php artisan test --filter='FinancialIdempotency|CommerceLedgerForeignKey'

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: farast
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: printf '%s\n' 'APP_NAME=FARAST' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' 'APP_URL=http://localhost' 'DB_CONNECTION=mysql' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_DATABASE=farast' 'DB_USERNAME=root' 'DB_PASSWORD=root' 'CACHE_STORE=array' 'SESSION_DRIVER=file' 'QUEUE_CONNECTION=sync' > .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php artisan test --filter='FinancialIdempotency|CommerceLedgerForeignKey'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: farast
          POSTGRES_USER: farast
          POSTGRES_PASSWORD: farast
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farast -d farast"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: printf '%s\n' 'APP_NAME=FARAST' 'APP_ENV=testing' 'APP_KEY=' 'APP_DEBUG=true' 'APP_URL=http://localhost' 'DB_CONNECTION=pgsql' 'DB_HOST=127.0.0.1' 'DB_PORT=5432' 'DB_DATABASE=farast' 'DB_USERNAME=farast' 'DB_PASSWORD=farast' 'CACHE_STORE=array' 'SESSION_DRIVER=file' 'QUEUE_CONNECTION=sync' > .env
      - run: php artisan key:generate
      - run: php artisan migrate:fresh --force
      - run: php artisan test --filter='FinancialIdempotency|CommerceLedgerForeignKey'
