name: FARAST multi-chat task coordinator

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

# Serialize all commands for the same canonical task Issue.
concurrency:
  group: farast-task-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  coordinate:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/farast'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coordinate canonical FARAST task
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const labels = (issue.labels || []).map(x => typeof x === 'string' ? x : x.name);
            const isTask = issue.title.startsWith('[FARAST-TASK]') || labels.includes('agent:task');
            if (!isTask) {
              core.info('Not a FARAST task issue; no action taken.');
              return;
            }

            const labelDefs = [
              { name: 'agent:task', color: '1D4ED8', description: 'Canonical FARAST task record' },
              { name: 'agent:ready', color: '0E8A16', description: 'Ready to be claimed by one agent chat' },
              { name: 'agent:locked', color: 'B60205', description: 'Claimed under an active lease' },
              { name: 'agent:blocked', color: 'D93F0B', description: 'Blocked pending resolution' },
              { name: 'agent:review', color: 'FBCA04', description: 'Implementation complete; review required' },
              { name: 'agent:done', color: '5319E7', description: 'Accepted and closed' }
            ];
            for (const label of labelDefs) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            const addLabel = async name => github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [name]
            });
            const removeLabel = async name => {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name }); }
              catch (e) { if (e.status !== 404) throw e; }
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const marker = '<!-- FARAST_AGENT_STATE_V1:';
            let state = null;
            for (const c of [...comments].reverse()) {
              const start = c.body.indexOf(marker);
              if (start < 0) continue;
              const end = c.body.indexOf('-->', start);
              if (end < 0) continue;
              try {
                state = JSON.parse(c.body.slice(start + marker.length, end).trim());
                break;
              } catch (_) {}
            }
            if (!state) {
              state = {
                schema_version: 1,
                task_key: 'GH-' + issue_number,
                issue_number,
                status: 'ready',
                lock: null,
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString(),
                last_run: null,
                runs: [],
                metrics: { runs_total: 0, retries_total: 0, completed_runs: 0, average_wall_seconds: null }
              };
            }

            const now = new Date();
            const nowIso = now.toISOString();
            const publish = async (message, nextState = state) => {
              nextState.updated_at = new Date().toISOString();
              const body = message + '\n\n' + marker + JSON.stringify(nextState) + ' -->';
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            };

            const event = context.eventName;
            if (event === 'issues') {
              if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
                await addLabel('agent:task');
                if (state.status === 'ready' && !state.lock) await addLabel('agent:ready');
                await publish('FARAST coordinator initialized this task. Canonical key: GH-' + issue_number +
                  '. Use /farast claim chat=UNIQUE_CHAT_ID run=UNIQUE_RUN_ID lease=60. Read docs/agent-coordination/README.md first.');
                return;
              }
              if (context.payload.action === 'closed') {
                if (state.status !== 'review') {
                  await github.rest.issues.update({ owner, repo, issue_number, state: 'open' });
                  await publish('Closure rejected: task must reach review state through /farast review and pass independent acceptance before it can be closed. Issue has been reopened.');
                  return;
                }
                state.status = 'done';
                state.lock = null;
                await removeLabel('agent:locked');
                await removeLabel('agent:ready');
                await removeLabel('agent:review');
                await removeLabel('agent:blocked');
                await addLabel('agent:done');
                await publish('Task issue closed by an authorized collaborator after review state. State is done.', state);
                return;
              }
            }

            const body = (context.payload.comment.body || '').trim();
            const match = body.match(/^\/farast\s+(claim|heartbeat|release|status|block|review)\b([\s\S]*)$/i);
            if (!match) return;

            const command = match[1].toLowerCase();
            const argsText = match[2] || '';
            const args = {};
            for (const m of argsText.matchAll(/([a-z_]+)=([^\s]+)/gi)) args[m[1].toLowerCase()] = m[2];
            const actor = context.payload.comment.user.login;
            const chatId = args.chat || '';
            const runId = args.run || '';
            const leaseMinutes = Math.max(5, Math.min(240, Number(args.lease || 60)));
            const reason = argsText.replace(/\b(chat|run|lease)=[^\s]+/gi, '').trim();

            const association = context.payload.comment.author_association || 'NONE';
            if (!['OWNER', 'COLLABORATOR', 'MEMBER'].includes(association)) {
              await publish('Request rejected: @' + actor + ' is not recognized by GitHub as an authorized repository collaborator/member. GitHub author_association: ' + association + '.');
              return;
            }

            const active = !!(state.lock && state.lock.expires_at &&
              new Date(state.lock.expires_at).getTime() > now.getTime());
            state.runs = state.runs || [];
            const finishRun = status => {
              const run = state.runs.findLast ? state.runs.findLast(x => x.run_id === state.lock?.run_id) :
                [...state.runs].reverse().find(x => x.run_id === state.lock?.run_id);
              if (run && !run.finished_at) {
                run.finished_at = nowIso;
                run.status = status;
                run.wall_seconds = Math.max(0, Math.floor((now.getTime() - new Date(run.started_at).getTime()) / 1000));
              }
              if (state.last_run && state.last_run.run_id === state.lock?.run_id && !state.last_run.finished_at) {
                state.last_run.finished_at = nowIso;
                state.last_run.status = status;
                state.last_run.wall_seconds = run?.wall_seconds ?? null;
              }
            };
            const refreshMetrics = () => {
              const completed = state.runs.filter(x => x.finished_at && Number.isFinite(x.wall_seconds));
              state.metrics = {
                runs_total: state.runs.length,
                retries_total: Math.max(0, state.runs.length - 1),
                completed_runs: completed.length,
                average_wall_seconds: completed.length
                  ? Math.round(completed.reduce((sum, x) => sum + x.wall_seconds, 0) / completed.length)
                  : null
              };
            };

            if (command === 'status') {
              const lockText = active
                ? 'Active lock: @' + state.lock.actor + ', chat ' + state.lock.chat_id +
                  ', run ' + state.lock.run_id + ', expires ' + state.lock.expires_at + '.'
                : 'No active lease.';
              await publish('Coordinator status: ' + state.status + '. ' + lockText);
              return;
            }

            if (command === 'claim') {
              if (!chatId || !runId || !Number.isFinite(leaseMinutes)) {
                await publish('Claim rejected. Required: /farast claim chat=UNIQUE_CHAT_ID run=UNIQUE_RUN_ID lease=60 (5–240 minutes).');
                return;
              }
              if (active) {
                await publish('Claim denied: already leased to @' + state.lock.actor +
                  ' (chat ' + state.lock.chat_id + ', run ' + state.lock.run_id +
                  ') until ' + state.lock.expires_at + '. Do not start this task.');
                return;
              }
              if (state.lock && !active) finishRun('lease_expired');
              const token = require('crypto').randomUUID();
              const attemptNo = state.runs.length + 1;
              const expires = new Date(now.getTime() + leaseMinutes * 60000).toISOString();
              state.status = 'in_progress';
              state.lock = {
                actor, chat_id: chatId, run_id: runId, lease_id: token,
                claimed_at: nowIso, heartbeat_at: nowIso, expires_at: expires
              };
              const runRecord = { run_id: runId, chat_id: chatId, actor, attempt_no: attemptNo,
                started_at: nowIso, finished_at: null, status: 'in_progress', wall_seconds: null };
              state.runs.push(runRecord);
              state.last_run = runRecord;
              refreshMetrics();
              await addLabel('agent:locked');
              await removeLabel('agent:ready');
              await removeLabel('agent:blocked');
              await publish('CLAIM GRANTED to @' + actor + '. Task GH-' + issue_number +
                '. Chat: ' + chatId + '. Run: ' + runId + '. Lease ID: ' + token +
                '. Lease expires: ' + expires + ' UTC. Only this chat/run may work. Renew with /farast heartbeat chat=' +
                chatId + ' run=' + runId + ' lease=' + leaseMinutes + '.', state);
              return;
            }

            if (!active) {
              await publish('Command ' + command + ' rejected: no active lease. Claim first.');
              return;
            }
            if (state.lock.actor !== actor || state.lock.chat_id !== chatId || state.lock.run_id !== runId) {
              await publish('Command ' + command + ' rejected: actor/chat/run does not match active lease owned by @' +
                state.lock.actor + ', chat ' + state.lock.chat_id + ', run ' + state.lock.run_id + '.');
              return;
            }

            if (command === 'heartbeat') {
              state.lock.heartbeat_at = nowIso;
              state.lock.expires_at = new Date(now.getTime() + leaseMinutes * 60000).toISOString();
              await publish('Lease renewed for ' + chatId + ' until ' + state.lock.expires_at + ' UTC.', state);
              return;
            }
            if (command === 'release') {
              finishRun('released');
              refreshMetrics();
              state.status = 'ready';
              state.lock = null;
              await removeLabel('agent:locked');
              await addLabel('agent:ready');
              await publish('Lease released. Task remains ready and is not marked complete.', state);
              return;
            }
            if (command === 'block') {
              finishRun('blocked');
              refreshMetrics();
              state.status = 'blocked';
              state.blocker = { reason: reason || 'No reason supplied', reported_by: actor, at: nowIso };
              state.lock = null;
              await removeLabel('agent:locked');
              await removeLabel('agent:ready');
              await addLabel('agent:blocked');
              await publish('Task marked blocked. Reason: ' + (reason || 'Not supplied') + '. Lease released.', state);
              return;
            }
            if (command === 'review') {
              finishRun('review');
              refreshMetrics();
              state.status = 'review';
              state.completed_by = { actor, chat_id: chatId, run_id: runId, at: nowIso };
              state.lock = null;
              await removeLabel('agent:locked');
              await removeLabel('agent:ready');
              await addLabel('agent:review');
              await publish('Implementation reported complete; task moved to review. This is not acceptance. An independent reviewer must verify the PR and evidence.', state);
            }
