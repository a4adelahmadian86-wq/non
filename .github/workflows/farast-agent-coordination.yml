name: FARAST multi-chat task coordinator

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

# One serialized coordinator per GitHub Issue (the canonical task record).
# Never set cancel-in-progress=true: an in-flight claim must not be cancelled.
concurrency:
  group: farast-task-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  coordinate:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/farast'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Serialize and apply task coordination command
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const labels = (issue.labels || []).map(x => typeof x === 'string' ? x : x.name);
            const isTask = issue.title.startsWith('[FARAST-TASK]') || labels.includes('agent:task');

            if (!isTask) {
              core.info('Not a FARAST task issue; no action taken.');
              return;
            }

            const labelDefs = [
              { name: 'agent:task', color: '1D4ED8', description: 'Canonical FARAST task record' },
              { name: 'agent:ready', color: '0E8A16', description: 'Ready to be claimed by one agent chat' },
              { name: 'agent:locked', color: 'B60205', description: 'Claimed under an active lease' },
              { name: 'agent:blocked', color: 'D93F0B', description: 'Blocked pending resolution' },
              { name: 'agent:review', color: 'FBCA04', description: 'Implementation complete; review required' },
              { name: 'agent:done', color: '5319E7', description: 'Accepted and closed' }
            ];
            for (const label of labelDefs) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            const addLabel = async name => github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [name]
            });
            const removeLabel = async name => {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name }); }
              catch (e) { if (e.status !== 404) throw e; }
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const marker = '<!-- FARAST_AGENT_STATE_V1:';
            let state = null;
            for (const c of [...comments].reverse()) {
              const start = c.body.indexOf(marker);
              if (start < 0) continue;
              const end = c.body.indexOf('-->', start);
              if (end < 0) continue;
              try {
                state = JSON.parse(c.body.slice(start + marker.length, end).trim());
                break;
              } catch (_) { /* ignore malformed historical state; continue backwards */ }
            }
            if (!state) {
              state = {
                schema_version: 1,
                task_key: `GH-${issue_number}`,
                issue_number,
                status: 'ready',
                lock: null,
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString(),
                last_run: null
              };
            }

            const now = new Date();
            const nowIso = now.toISOString();
            const event = context.eventName;

            const publish = async (message, nextState = state) => {
              nextState.updated_at = new Date().toISOString();
              const body = [
                message,
                '',
                marker + JSON.stringify(nextState) + ' -->'
              ].join('\n');
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            };

            if (event === 'issues') {
              if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
                await addLabel('agent:task');
                if (state.status === 'ready' && !state.lock) await addLabel('agent:ready');
                await publish(
                  `FARAST coordinator initialized this task record. Canonical task key: **GH-${issue_number}**.\n\nUse `/farast claim chat=<unique-chat-id> run=<unique-run-id> lease=60` to request an exclusive lease. Read `docs/agent-coordination/README.md` first.`
                );
                return;
              }
              if (context.payload.action === 'closed') {
                state.status = 'done';
                state.lock = null;
                await removeLabel('agent:locked');
                await removeLabel('agent:ready');
                await removeLabel('agent:review');
                await removeLabel('agent:blocked');
                await addLabel('agent:done');
                await publish('Task issue closed. Coordinator state is now **done**.', state);
                return;
              }
            }

            const body = (context.payload.comment.body || '').trim();
            const match = body.match(/^\/farast\s+(claim|heartbeat|release|status|block|review)\b([\s\S]*)$/i);
            if (!match) return;

            const command = match[1].toLowerCase();
            const argsText = match[2] || '';
            const args = {};
            for (const m of argsText.matchAll(/([a-z_]+)=([^\s]+)/gi)) args[m[1].toLowerCase()] = m[2];
            const actor = context.payload.comment.user.login;
            const chatId = args.chat || '';
            const runId = args.run || '';
            const leaseMinutes = Math.max(5, Math.min(240, Number(args.lease || 60)));
            const reason = argsText.replace(/\b(chat|run|lease)=[^\s]+/gi, '').trim();

            // Only repository collaborators with at least triage access can coordinate tasks.
            let permission = 'none';
            try {
              const p = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor
              });
              permission = p.data.permission;
            } catch (_) { permission = 'none'; }
            if (!['admin', 'maintain', 'write', 'triage'].includes(permission)) {
              await publish(`Request rejected: @${actor} does not have repository triage/write permission.`);
              return;
            }

            const active = state.lock &&
              state.lock.expires_at &&
              new Date(state.lock.expires_at).getTime() > now.getTime();

            if (command === 'status') {
              const lockText = active
                ? `Active lock: @${state.lock.actor}, chat \`${state.lock.chat_id}\`, run \`${state.lock.run_id}\`, expires \`${state.lock.expires_at}\`.`
                : 'No active lease.';
              await publish(`Coordinator status: **${state.status}**. ${lockText}`);
              return;
            }

            if (command === 'claim') {
              if (!chatId || !runId || !Number.isFinite(leaseMinutes)) {
                await publish('Claim rejected. Required syntax: `/farast claim chat=<unique-chat-id> run=<unique-run-id> lease=60` (lease is 5–240 minutes).');
                return;
              }
              if (active) {
                await publish(`Claim denied: task is already leased to @${state.lock.actor} (chat \`${state.lock.chat_id}\`, run \`${state.lock.run_id}\`) until \`${state.lock.expires_at}\`. Do not start this task.`);
                return;
              }
              const token = crypto.randomUUID();
              const expires = new Date(now.getTime() + leaseMinutes * 60000).toISOString();
              state.status = 'in_progress';
              state.lock = {
                actor, chat_id: chatId, run_id: runId, fencing_token: token,
                claimed_at: nowIso, heartbeat_at: nowIso, expires_at: expires
              };
              state.last_run = { run_id: runId, chat_id: chatId, actor, started_at: nowIso };
              await addLabel('agent:locked');
              await removeLabel('agent:ready');
              await removeLabel('agent:blocked');
              await publish(`<badge>Claim granted</badge> to @${actor}.\n\nTask: **GH-${issue_number}**  \nChat: \`${chatId}\`  \nRun: \`${runId}\`  \nFencing token: \`${token}\`  \nLease expires: \`${expires}\` UTC.\n\nOnly this chat/run may work on this task. Renew with `/farast heartbeat chat=${chatId} run=${runId} lease=${leaseMinutes}`.`, state);
              return;
            }

            if (!active) {
              await publish(`Command \`${command}\` rejected: there is no active lease. Claim the task first.`);
              return;
            }
            if (state.lock.actor !== actor || state.lock.chat_id !== chatId || state.lock.run_id !== runId) {
              await publish(`Command \`${command}\` rejected: actor/chat/run does not match the active lease. The active owner is @${state.lock.actor}, chat \`${state.lock.chat_id}\`, run \`${state.lock.run_id}\`.`);
              return;
            }

            if (command === 'heartbeat') {
              state.lock.heartbeat_at = nowIso;
              state.lock.expires_at = new Date(now.getTime() + leaseMinutes * 60000).toISOString();
              await publish(`Lease renewed for @${actor} / \`${chatId}\` until \`${state.lock.expires_at}\` UTC.`, state);
              return;
            }

            if (command === 'release') {
              state.status = 'ready';
              state.lock = null;
              await removeLabel('agent:locked');
              await addLabel('agent:ready');
              await publish(`Lease released by @${actor}. Task remains **ready** and is not marked complete.`, state);
              return;
            }

            if (command === 'block') {
              state.status = 'blocked';
              state.blocker = { reason: reason || 'No reason supplied', reported_by: actor, at: nowIso };
              state.lock = null;
              await removeLabel('agent:locked');
              await removeLabel('agent:ready');
              await addLabel('agent:blocked');
              await publish(`Task marked **blocked**. Reason: ${reason || 'Not supplied'}. Lease released.`, state);
              return;
            }

            if (command === 'review') {
              state.status = 'review';
              state.completed_by = { actor, chat_id: chatId, run_id: runId, at: nowIso };
              state.lock = null;
              await removeLabel('agent:locked');
              await removeLabel('agent:ready');
              await addLabel('agent:review');
              await publish('Implementation reported complete; task moved to **review**. This is not acceptance. A human/independent reviewer must verify the PR and evidence before closing the issue.', state);
              return;
            }
