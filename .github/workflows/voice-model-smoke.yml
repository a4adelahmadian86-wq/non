name: FARAST Voice Model Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'voice-stream/sherpa-sidecar/**'
      - 'voice-stream/providers/sherpa-onnx.mjs'
      - 'voice-stream/scripts/sherpa-sidecar-smoke.mjs'
      - '.github/workflows/voice-model-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'voice-stream/sherpa-sidecar/**'
      - 'voice-stream/providers/sherpa-onnx.mjs'
      - 'voice-stream/scripts/sherpa-sidecar-smoke.mjs'
      - '.github/workflows/voice-model-smoke.yml'

permissions:
  contents: read

concurrency:
  group: farast-voice-model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sherpa-persian-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --prefix voice-stream --no-audit --no-fund
      - run: pip install --no-cache-dir -r voice-stream/sherpa-sidecar/requirements.txt
      - run: python voice-stream/sherpa-sidecar/download_model.py
        env:
          SHERPA_MODEL_DIR: ${{ runner.temp }}/farast-sherpa-models
      - run: python voice-stream/sherpa-sidecar/smoke_test.py
        env:
          SHERPA_MODEL_DIR: ${{ runner.temp }}/farast-sherpa-models
          SHERPA_NUM_THREADS: '2'
      - name: Start the real Sherpa sidecar and test the gateway protocol
        shell: bash
        run: |
          set -euo pipefail
          SHERPA_HOST=127.0.0.1 SHERPA_PORT=6006 SHERPA_MODEL_DIR="${RUNNER_TEMP}/farast-sherpa-models" SHERPA_NUM_THREADS=2 python voice-stream/sherpa-sidecar/server.py > /tmp/farast-sherpa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 180); do
            if grep -q 'listening on ws://127.0.0.1:6006' /tmp/farast-sherpa.log; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/farast-sherpa.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/farast-sherpa.log; exit 1; fi
          SHERPA_ONNX_WS_URL=ws://127.0.0.1:6006 node voice-stream/scripts/sherpa-sidecar-smoke.mjs
          cat /tmp/farast-sherpa.log
